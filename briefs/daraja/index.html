<script>
/* Meeting content. [Chinese, English] pairs keep every explanation together. */
window.BRIEF = [
  {
    id: 'architecture', nav: ['平台架构', 'Architecture'],
    title: ['从业务出发。\n为增长留好空间。', 'Built around your business.\nReady for what comes next.'],
    question: ['01 · 我们如何架构 Daraja？', '01 · How would we architect Daraja?'],
    lead: ['以一个清晰的业务核心，连接买家、供应商与运营团队。先让一条真实交易跑通，再逐步扩展。', 'Connect buyers, suppliers and operations around one coherent business core. Prove a real trading journey first, then expand.'],
    takeaway: ['建议：定制门户 + 成熟业务底座 + Daraja 专属业务模块。', 'Recommendation: custom portals, a proven business foundation and Daraja-specific modules.'],
    cards: [
      {title:['体验独立','Your own experience'], body:['买家、供应商、运营各有工作空间，共享同一套业务事实。','Dedicated workspaces for buyers, suppliers and operations, sharing the same business records.']},
      {title:['核心模块化','A modular core'], body:['采购、订单、仓储、物流有清晰边界，首期集中部署，控制复杂度。','Clear procurement, order, warehouse and logistics boundaries; initially deployed together to limit complexity.']},
      {title:['资产可交接','Built for handover'], body:['在客户控制的账户中部署，交付源码、数据结构、部署与运维说明。','Deploy in client-controlled accounts and hand over source, data models, deployment assets and runbooks.']}
    ],
    diagram: 'architecture',
    details: [
      {title:['先确认 Daraja 的交易身份','First establish Daraja’s trading role'], paragraphs:[
        ['如果 Daraja 向买家销售并向工厂采购，系统需要销售单、采购单和应收应付；如果是代采购，需要委托关系、服务费和代付记录；如果只撮合交易，则要明确交易双方和平台服务边界。','If Daraja buys from factories and resells, we need sales orders, purchase orders, receivables and payables. An agency model needs mandates, service fees and payment-on-behalf records. A marketplace model needs explicit trading parties and platform responsibilities.'],
        ['首期选择一种主交易模式。商品品类、货源国家、仓库位置和收款责任都需要结合 Technology Brief 确认，不能由技术方案默认。','Choose one primary trading model for the pilot. Product categories, sourcing countries, warehouse locations and payment responsibilities must be confirmed against the Technology Brief.'],
        ['货物所有权、实际保管方和记账主体分别记录。ERPNext 自营采购与库存流程是否适用，要先用真实单据验证；代采或第三方保管不能仅因货物入仓就自动确认为 Daraja 的库存资产或应付账款。','Record the goods owner, physical custodian and accounting entity separately. Validate ERPNext purchasing and stock flows against real documents. Receipt of agency or third-party goods must not automatically recognise Daraja-owned inventory or payables.']
      ]},
      {title:['让每一份业务数据只有一个权威来源','Give each business record one authoritative home'], paragraphs:[
        ['企业、商品、询价、报价、订单、包装件、集运批次、付款和单证分别建模。明确每个对象由哪个模块创建和修改；门户只通过有权限控制的 API 访问。','Model organisations, products, RFQs, quotations, orders, packages, consolidation batches, payments and documents separately. Assign ownership of each record to one module; portals access it through authorised APIs.'],
        ['报价确认与订单创建采用事务或可恢复工作流。通知、PDF、物流同步放入后台任务，失败可重试；业务事件与原始修改一起可靠保存，避免订单成功但后续任务丢失。','Use transactions or recoverable workflows for quotation acceptance and order creation. Run notifications, PDFs and logistics updates as retryable background jobs. Persist business events reliably with the original change so follow-up work is not lost.']
      ]},
      {title:['私有部署与长期可维护性怎么落实','Make private deployment maintainable'], paragraphs:[
        ['生产与测试环境分开；数据库和文件备份定期恢复演练。运营人员启用多因素认证，重要操作留审计记录。日志、告警和升级流程作为交付的一部分。','Separate production and staging. Regularly rehearse database and file restoration. Require MFA for operational staff and audit sensitive actions. Include monitoring, alerts and an upgrade process in the handover.'],
        ['定制代码的权利在合同中约定；第三方开源组件保留原有许可证。交付依赖清单、版本锁定、数据导出和接手说明，让客户能够更换维护团队。','Define rights to custom code in the contract; third-party components retain their own licences. Supply a dependency inventory, pinned versions, data exports and handover instructions so the client can change maintainers.'],
        ['需要确认 proprietary 指品牌、数据和独立运营，还是要求所有交付代码闭源且可独占再许可。选择 ERPNext 前，应审查拟交付模块与 GPL 底座的组合及分发方式；独立目录、Frappe 应用或 API 边界本身不构成闭源许可结论。','Clarify whether proprietary means control of brand, data and operation, or a requirement for all delivered code to remain closed and exclusively relicensable. Before selecting ERPNext, review how delivered modules combine with and distribute the GPL foundation; a separate directory, Frappe app or API boundary alone does not establish proprietary licensing rights.']
      ]}
    ],
    outcome:['本部分交付：业务边界图、系统架构图、核心数据模型、部署与交接清单。','Deliverables: business boundaries, an architecture diagram, core data model and deployment/handover checklist.'],
    ask:['会议确认：Daraja 是贸易商、代采购服务商，还是撮合平台？首期谁签合同、谁收款、谁承担履约？','Discuss: is Daraja a reseller, sourcing agent or marketplace? Who contracts, collects payment and owns fulfilment in the pilot?'],
    talk:['“我们会围绕你的实际交易方式设计系统。首期采用模块化架构，让平台可以独立运营，也能随着业务增长逐步扩展。”','“We would design the platform around how your business actually trades. A modular foundation lets you operate independently today and expand as your business grows.”'],
    sources:[['Frappe REST API','https://docs.frappe.io/framework/user/en/api/rest'],['Medusa commerce modules','https://docs.medusajs.com/learn/fundamentals/modules/commerce-modules']]
  },
  {
    id:'foundations', nav:['自研与开源底座','Build & reuse'],
    title:['成熟能力，复用。\n业务差异，定制。','Reuse what is proven.\nBuild what makes you different.'],
    question:['02 · 哪些自研，哪些采用现有技术？','02 · What should we build, and what should we reuse?'],
    lead:['优先验证能承接采购与仓储的成熟底座，再判断电商引擎是否更适合业务重心。开源降低重复开发，不会消除产品设计和集成工作。','Validate foundations with procurement and warehouse capabilities first, then assess whether commerce is the better centre of gravity. Open source reduces repeated work; product design and integration still matter.'],
    takeaway:['初步方向：采购运营主导，先验证 ERPNext；商城交易主导，再验证 Medusa。','Initial direction: evaluate ERPNext for procurement-led operations; evaluate Medusa if commerce leads.'],
    cards:[
      {title:['复用基础能力','Reuse the foundations'],body:['ERPNext 已有采购、基础报价对比、质检与到岸成本能力，先验证再扩展。','ERPNext provides procurement, basic quote comparison, inspections and landed costs. Validate these before extending them.']},
      {title:['定制核心差异','Build the differentiators'],body:['买家寻源体验、包裹照片、跨货主集运及客户费用结算，按底座差距定制。','Customise buyer sourcing, package photos, multi-owner consolidation and customer charge settlement where the foundation has gaps.']},
      {title:['连接专业服务','Integrate specialist services'],body:['支付、承运商、通知与 AI，通过可替换适配器接入。','Payments, carriers, notifications and AI connected through replaceable adapters.']}
    ],
    diagram:'foundations',
    details:[
      {title:['如何在两个主候选之间做决定','How we choose between the two leading candidates'],paragraphs:[
        ['ERPNext 路线：复用采购与库存业务，在 Frappe 独立应用中扩展 Daraja 模块，并定制外部门户。重点验证外部企业隔离、报价体验及跨客户集运，不能把企业内部 ERP 界面直接当作 marketplace。','ERPNext route: reuse procurement and stock workflows, extend through a separate Frappe app and build external portals. Validate external-company isolation, the quotation experience and cross-customer consolidation; an internal ERP interface is not a ready-made marketplace.'],
        ['Medusa 路线：复用商品、定价和销售订单能力，在其框架内扩展寻源、采购与集运。它更贴近商城，但采购与仓储现场流程需要更多定制。首期不同时引入两个业务底座。','Medusa route: reuse products, pricing and sales orders, then extend its framework for sourcing, purchasing and consolidation. It is closer to storefront commerce, but procurement and warehouse operations require more custom work. Start with one business foundation.']
      ]},
      {title:['用一个小型验证决定底座','Choose the foundation with a bounded proof of concept'],paragraphs:[
        ['用同一组样例比较：一个多明细 RFQ，按行选定两家供应商，分批收货，并与第二买家的货物合并发运。贸易商模式验证销售单拆采购单；代采模式改用委托及实际交易方关系，检查货权和记账。','Compare candidates using a multi-line RFQ awarded by line to two suppliers, partial receipts and consolidation with a second buyer’s goods. Test sales-to-purchase splitting for resale; for agency, use mandates and actual trading parties and verify ownership and accounting.'],
        ['先在主候选上做有边界的验证，备选做功能差距对比。必须检查跨买家、跨供应商访问，包装件数量追溯，重复付款通知，以及一次兼容版本升级。可先用接口样例模拟第三方服务，不能把该验证当作生产集成验收。','Run a bounded proof on the leading candidate and a gap comparison on alternatives. Check cross-buyer and cross-supplier access, package quantity traceability, duplicate payment events and one compatible upgrade. Provider fixtures may be used initially; this is not production integration acceptance.']
      ]},
      {title:['开源底座的真实成本与源码边界','The real cost and ownership boundaries'],paragraphs:[
        ['总成本包含业务二开、数据整理、第三方接口、部署、维护升级，以及需要时的商业扩展授权。当前没有完整 Brief，不承诺固定复用比例或报价。','Total cost includes custom workflows, data preparation, third-party integrations, hosting, upgrades and any commercial extensions. Without the full Brief, we should not promise a fixed reuse percentage or quotation.'],
        ['GPL 系列许可不等于不能商业使用，但交付、修改及组合方式会影响相关义务。框架与应用、社区版与企业版要分别核对；定制代码的合同归属也不能改变第三方许可。','GPL-family licensing does not prohibit commercial use, but distribution, modification and integration choices affect obligations. Review the framework and application, and community and enterprise editions, separately. Custom-code ownership does not override third-party licences.']
      ]}
    ],
    outcome:['本部分交付：候选对比、样例验证、复用与定制清单、依赖许可清单、选型决策记录。','Deliverables: a candidate comparison, proof of concept, reuse/customisation map, licence inventory and architecture decision record.'],
    ask:['会议确认：核心是采购运营还是商城交易？proprietary 需要怎样的代码许可与独占权？未来谁负责维护？','Discuss: is procurement or commerce the core? What code-licensing and exclusivity rights does proprietary require? Who will maintain the platform?'],
    talk:['“我们会使用成熟开源能力，把开发投入集中到 Daraja 独有的业务流程上。最终底座会由真实场景验证决定。”','“We would reuse mature open-source capabilities and focus development on Daraja’s unique workflows. The final foundation would be selected through a real business scenario.”'],
    sources:[['ERPNext quotation comparison','https://docs.frappe.io/erpnext/supplier-quotation'],['ERPNext quality inspection','https://docs.frappe.io/erpnext/quality-inspection'],['ERPNext landed costs','https://docs.frappe.io/erpnext/landed-cost-voucher'],['Frappe licensing guidance','https://docs.frappe.io/legal/others/license-and-trademark']]
  },
  {
    id:'workspaces',nav:['三端与权限','Workspaces'],
    title:['各有工作空间。\n协作始终一致。','Different workspaces.\nOne connected operation.'],
    question:['03 · 买家、供应商和管理员如何组织？','03 · How should buyer, supplier and administrator environments work?'],
    lead:['以企业作为业务主体，以员工角色分配权限。每个人看到自己的工作，也清楚下一步由谁负责。','Make the organisation the business entity, with employee roles controlling access. Each person sees their own work and knows who owns the next step.'],
    takeaway:['一个身份体系，三个业务门户；仓库使用面向现场的简化界面。','One identity system, three business portals and a focused warehouse interface.'],
    cards:[
      {title:['买家端','Buyer workspace'],body:['创建采购需求、审批报价、查看付款与交付、下载单证、发起售后。','Create requests, approve quotations, track payments and deliveries, download documents and raise claims.']},
      {title:['供应商端','Supplier workspace'],body:['提交资质、维护商品、回复询价、更新交期、提交发货信息。','Submit credentials, maintain products, respond to RFQs, update lead times and provide dispatch information.']},
      {title:['运营端','Operations workspace'],body:['审核、寻源、采购、财务和仓储各有权限，通过异常队列协作。','Give verification, sourcing, procurement, finance and warehouse teams scoped access and shared exception queues.']}
    ],
    diagram:'workspaces',
    details:[
      {title:['组织、角色、数据范围一起判断','Combine organisation, role and record scope'],paragraphs:[
        ['一个企业可以有管理员、采购员、审批人和财务人员。同一个人如属于多家企业，必须明确切换当前企业。供应商只能访问发给自己的询价、自己的报价与履约记录。','An organisation can have owners, buyers, approvers and finance staff. A person belonging to multiple organisations must explicitly select the active organisation. Suppliers only access invitations, quotations and fulfilment records assigned to them.'],
        ['权限在服务端执行，包括字段与附件：买家能否看到工厂身份、进货价、平台加价，由商业规则决定。运营超级权限需受控；下载、导出和 AI 检索使用相同的数据范围。','Enforce authorisation on the server, including fields and attachments. Commercial rules determine whether buyers see factories, source prices and platform margins. Restrict privileged access; apply the same scope to downloads, exports and AI retrieval.'],
        ['ERPNext 的 Company 表示内部经营与记账主体，不能直接等同于每个外部买家或供应商租户。外部组织关联 Customer / Supplier 和成员身份；自定义 API、列表、报表及后台任务都要验证对象权限，不能假设框架会自动过滤所有查询。','ERPNext Company represents an internal operating/accounting entity, not every external buyer or supplier tenant. Map external organisations to Customer / Supplier records and memberships. Verify object permissions in custom APIs, lists, reports and background tasks; do not assume every framework query filters access automatically.'],
        ['企业管理员邀请并审核成员，切换企业时校验有效成员关系，离职或停用后撤销访问。第三方仓库人员仅访问授权仓库和指定货物，跨客户集运时限制价格、客户身份与附件可见范围。','Organisation administrators invite and approve members. Validate active membership on organisation switches and revoke disabled members’ access. Partner warehouse staff only access assigned warehouses and goods, with restricted prices, customer identities and attachments in consolidated views.']
      ]},
      {title:['把首页做成待办工作台','Make each home screen a working queue'],paragraphs:[
        ['买家优先看到待审批报价、待支付订单与预计到货；供应商看到待报价、即将到期和待发货；运营看到资质待审、收货差异、付款待核和物流超时。所有待办都能进入对应原始记录。','Buyers see pending approvals, payments and expected deliveries. Suppliers see open RFQs, deadlines and dispatch tasks. Operations see pending verification, receiving discrepancies, unmatched payments and overdue shipments. Every task links to its source record.'],
        ['看板指标先选可行动的少数项：询价响应时间、采购交期、异常包裹、在途批次。指标要统一计算口径，并允许追溯明细。','Start with a few actionable metrics: RFQ response time, procurement lead time, package exceptions and shipments in transit. Define consistent calculations and let users inspect the underlying records.']
      ]},
      {title:['仓库与手机端分阶段建设','Stage warehouse and mobile delivery'],paragraphs:[
        ['建议首期采用响应式网页，前提是客户确认满足首发移动任务与分发要求；不能直接替代她提出的移动应用需求。仓库的扫码、拍照、称重量方与异常登记先在实际设备和网络环境中验证。','Propose responsive web for the pilot only if the client confirms it meets initial mobile tasks and distribution needs; it is not automatically a substitute for requested mobile applications. Validate warehouse scanning, photos, weighing, measurement and exceptions on real devices and networks.'],
        ['如果现场必须离线作业，再交付具备本地队列的 Android 或跨平台应用。恢复网络后按唯一操作 ID 同步，同一包装件被重复分配时返回冲突；不能承诺普通网页天然支持可靠离线扫描。','If offline operations are required, deliver an Android or cross-platform app with a local queue. Sync using unique operation IDs and reject conflicting package allocations. Reliable offline scanning needs explicit design and testing.']

    ask:['会议确认：买家是否直接看到供应商？是否需要企业内审批？仓库是自营还是第三方？','Discuss: can buyers see suppliers directly? Are internal purchasing approvals required? Are warehouses operated by Daraja or partners?'],
    talk:['“三端共享同一条业务链，但每个角色只看到自己需要的信息和操作。我们会用具体页面和权限样例与你一起验证。”','“The three environments share one business journey, while each role sees only the information and actions it needs. We would validate this together through screens and permission examples.”'],
    sources:[['ERPNext user permissions','https://docs.frappe.io/erpnext/user-permissions'],['ERPNext Company','https://docs.frappe.io/erpnext/company-setup'],['Frappe database permissions','https://docs.frappe.io/framework/user/en/api/database']]

  {
    id:'workflow',nav:['采购到交付','End-to-end workflow'],
    title:['从一份需求，\n到一次可靠交付。','From a sourcing request\nto a delivery you can trust.'],
    question:['04 · RFQ → 报价 → 采购 → 仓库 → 物流如何衔接？','04 · How do RFQ, quotation, procurement, warehouse and logistics connect?'],
    lead:['每个阶段都有负责人、业务记录和进入下一步的条件。允许分批采购、分批收货与跨订单集运。','Give every stage an owner, a record and clear conditions for moving forward. Support split purchasing, partial receipts and consolidation across orders.'],
    takeaway:['订单、包装件、运输批次和付款分别管理，通过明细关联追溯。','Manage orders, packages, shipments and payments separately, with line-level traceability.'],
    cards:[
      {title:['成交可追溯','Traceable agreements'],body:['锁定规格、价格、币种、条款和报价版本；变更需要确认。','Freeze specifications, prices, currencies, terms and quote versions; approve subsequent changes.']},
      {title:['履约可拆分','Flexible fulfilment'],body:['一张订单可对应多家供应商，一批集运可包含多张订单。','One order may involve several suppliers; one shipment may contain several orders.']},
      {title:['异常有出口','Exceptions have an owner'],body:['短收、破损、延误和退款形成待办，明确处理人与处理记录。','Shortages, damage, delays and refunds become assigned tasks with an auditable resolution.']}
    ],
    diagram:'workflow',
    details:[
      {title:['01–02 · 询价与报价：先统一比较口径','01–02 · RFQs and quotations: compare like for like'],paragraphs:[
        ['买家提交品类、规格、数量、目标交期、目的地与附件；运营澄清后邀请供应商。报价保存 MOQ、单价、币种、交期、有效期和交货条件，每次修改生成版本。','Buyers provide category, specifications, quantity, target date, destination and attachments. Operations clarify and invite suppliers. Quotations retain MOQ, unit price, currency, lead time, validity and delivery terms, with versioned revisions.'],
        ['报价对比同时展示商品价和已知附加费用；未知运费或税费标为待确认。多币种换算显示汇率来源与时间，成交时固化约定金额和汇率，避免把估算当成最终到岸价。','Compare item prices and known additional charges; flag unknown freight or taxes. Currency comparisons show rate source and time. Freeze agreed amounts and rates at acceptance so estimates are not mistaken for final landed costs.'],
        ['采购需求明细与供应商商品编码分别保存；成交时确认规格版本、替代品、计量单位和换算关系，并按行分配中选数量。同名商品不自动视为同一规格，供应商改目录也不改变历史成交记录。','Keep request lines separate from supplier item codes. At award, confirm specification versions, substitutions, units and conversions, then allocate awarded quantities by line. Matching names do not establish matching specifications, and catalogue changes must not rewrite accepted records.']
      ]},
      {title:['03 · 采购与付款：把商业关系建对','03 · Procurement and payments: model the commercial relationship'],paragraphs:[
        ['在贸易商模式下，买家确认后生成销售单，再按供应商拆成采购单；代采购或撮合模式使用对应委托及订单关系。每条采购明细回指成交明细，保留数量、交期与责任方。','In a resale model, buyer acceptance creates a sales order that splits into supplier purchase orders. Agency or marketplace models use their corresponding mandates and order relationships. Link each purchase line to the accepted line, quantity, due date and responsible party.'],
        ['订金、尾款、退款与供应商付款单独记账并分配到单据。支付通知以交易标识去重；超时进入查询或人工对账，付款状态不因一次网络错误直接判为失败。M-Pesa 是否首期接入取决于收款主体与客户支付习惯。','Record deposits, balances, refunds and supplier payments separately and allocate them to documents. Deduplicate payment notifications by transaction identity; route timeouts to status checks or reconciliation. Confirm the receiving entity and buyer preferences before making M-Pesa a pilot requirement.'],
        ['每笔费用记录责任方、币种、估算或实结状态：采购款、服务费、仓储、运输及退款分别处理。按合同约定以重量、体积、金额或固定比例分摊，并保留调整记录。ERPNext 的入库成本分摊与向客户收取集运费用需要区分；收款成功也不代表供应商已结清。','For each charge, record the responsible party, currency and estimated/actual status. Separate goods, service, storage, freight and refund amounts. Allocate by contracted weight, volume, value or fixed shares with adjustment history. Distinguish ERPNext inventory landed-cost allocation from customer consolidation charges; payment received does not mean a supplier has been settled.'],
        ['记录付款人、收款人、结算对象和未结余额，区分平台收入、应收应付与代收代付资金。退款关联原收款和费用分配，确认可退金额、保留费用及承担方；不预设平台提供资金托管或自动分账。','Record payer, recipient, settlement party and outstanding balance. Separate platform revenue, receivables/payables and funds handled on behalf of clients. Link refunds to original receipts and allocations, defining refundable amounts, retained charges and responsibility. Do not assume escrow or automated split settlement.']
      ]},
      {title:['04–05 · 收货与集运：以实际包装件为准','04–05 · Receiving and consolidation: track actual packages'],paragraphs:[
        ['按采购或委托收货明细分批接收。每个包装件分配条码，记录货主、保管方、实收数量、重量、尺寸、库位、照片和质检结论。货权与估值记账单独确认；短收和破损建立差异记录，未放行货物不能进入可发运池。','Receive in batches against purchase or authorised custody lines. Give packages barcodes and record owners, custodians, actual quantities, weight, dimensions, locations, photos and inspection. Confirm ownership and valuation separately; hold shortages and damage outside the dispatch pool until released.'],
        ['用包装件内容明细连接订单与集运批次，记录商品、来源行、货主、数量和单位。首期同一包装件不混不同货主；拆包或重装生成新条码并保留父子关系。各阶段校验数量平衡，禁止重复占用或超量发运。','Link orders and shipments through package-content lines with item, source line, owner, quantity and unit. Keep different owners in separate packages for the pilot. Splitting or repacking creates new barcodes with lineage. Reconcile quantities across stages and prevent duplicate allocation or over-dispatch.'],
        ['在满足付款或信用条件、质检及单证条件后放行；具体门槛由客户确认。重量/体积只是容量校验，首期由操作员确认真实装载可行性。混柜可跨货主，但买家只下载自己的箱单，完整总箱单仅限授权运营与物流人员。','Release goods against agreed payment or credit conditions, inspection and document requirements. Weight/volume checks support an operator’s loading decision. A consolidated container may include several owners, but buyers receive only their own packing lists; the full manifest is limited to authorised operations and logistics staff.']
      ]},
      {title:['06 · 物流、单证与售后形成闭环','06 · Close the loop with logistics, documents and claims'],paragraphs:[
        ['定义已发运、运输中、到港、清关、派送和签收等节点，记录来源与发生时间。没有承运商接口时允许授权人员录入并上传凭证，后续再逐家接入 API。','Define dispatch, transit, arrival, customs, last-mile and delivery milestones with source and event time. Where carrier APIs are unavailable, authorised staff can record updates with evidence; add carrier integrations incrementally.'],
        ['PI、商业发票和装箱单在签发时保存版本与数据快照，修订生成新版本。签收后处理索赔、补货或退款，保留原订单和库存变动的关联。','Save versioned data snapshots when issuing pro forma invoices, commercial invoices and packing lists. Revisions create new versions. Link claims, replacements and refunds back to the original orders and stock movements.']
      ]}
    ],
    outcome:['验收样例：两个供应商分批送货，其中一件破损；合格货物先发运，剩余货物后补，费用和单证均能追溯。','Acceptance scenario: two suppliers deliver in parts, one package is damaged, released goods ship first and the balance follows later, with traceable charges and documents.'],
    ask:['会议确认：何时付订金与尾款？谁验货？谁承担破损？哪些物流节点由系统接入、哪些由人员维护？','Discuss: when are deposits and balances due? Who inspects goods and owns damage claims? Which logistics events come from integrations and which from staff?'],
    talk:['“我们会把交易、货物和运输分别管理。这样即使两家工厂不同时间交货，或者客户要求先发一部分，系统也能准确追踪。”','“We would manage the transaction, the physical goods and the shipment separately. That keeps the records accurate when factories deliver at different times or a customer requests a partial shipment.”'],
    sources:[['ERPNext procurement','https://docs.frappe.io/erpnext/request-for-quotation'],['ERPNext customer-provided items','https://docs.frappe.io/erpnext/customer-provided-items'],['ERPNext landed costs','https://docs.frappe.io/erpnext/landed-cost-voucher'],['Safaricom payment APIs','https://developer.safaricom.co.ke/']]

  {
    id:'ai',nav:['AI 演进','AI roadmap'],
    title:['让 AI 有依据。\n让决策有把握。','AI with evidence.\nDecisions with confidence.'],
    question:['05 · 未来如何构建 AI 能力？','05 · How would we introduce the AI layer?'],
    lead:['先把采购数据整理好，再从辅助理解与检索开始。业务人员保留对报价、供应商和采购承诺的最终决定权。','Build reliable procurement data first, then start with assistance and retrieval. People retain final control over quotes, supplier selection and purchasing commitments.'],
    takeaway:['先做资料提取与供应商候选推荐，再用真实反馈改进采购判断。','Start with document extraction and supplier shortlists, then improve recommendations using real feedback.'],
    cards:[
      {title:['读懂需求','Understand requests'],body:['从文字或文档提取规格、数量和交期，生成可编辑的询价草稿。','Extract specifications, quantities and deadlines from text or documents into an editable RFQ draft.']},
      {title:['找到候选','Find candidates'],body:['先筛资质与供货条件，再结合商品语义检索，并解释推荐理由。','Filter by qualification and supply constraints, then use semantic product search with explained recommendations.']},
      {title:['辅助判断','Support decisions'],body:['汇总报价差异和履约记录，标明数据来源、时间与缺失项。','Summarise quote differences and delivery history, showing sources, dates and missing information.']}
    ],
    diagram:'ai',
    details:[
      {title:['第一阶段：积累可用的数据','Stage one: establish usable data'],paragraphs:[
        ['商品属性、计量单位、供应商资质、报价版本、交期与履约结果采用统一结构。保留实际采购人员的入围、淘汰与原因，作为后续评估依据。','Standardise product attributes, units, supplier qualifications, quote versions, lead times and fulfilment outcomes. Record sourcing staff’s shortlist decisions and rejection reasons for future evaluation.'],
        ['首期可提供文档提取试点，但所有金额、单位和数量必须人工确认再写入正式业务记录；AI 服务不可用时仍能手工完成流程。','An initial document-extraction pilot is possible, but people must confirm amounts, units and quantities before committing business records. The manual workflow remains available when AI is unavailable.']
      ]},
      {title:['第二阶段：检索增强的供应商匹配','Stage two: retrieval-based supplier matching'],paragraphs:[
        ['先按可见权限、品类、资质、MOQ、交期和服务市场过滤，再做关键词与向量检索，最后根据可核验信息排序。推荐卡片展示匹配规格、履约证据和缺失条件。','Filter by access rights, category, credentials, MOQ, lead time and served markets before keyword and vector retrieval. Rank using verifiable evidence. Recommendation cards show matched specifications, delivery evidence and unmet conditions.'],
        ['模型通过可替换接口调用。向量检索可选择 PostgreSQL + pgvector；如果主业务底座使用其他数据库，仅在需要 AI 时增加独立检索索引，业务数据库仍是权威来源。','Access models through a replaceable interface. PostgreSQL with pgvector is a retrieval option. If the business foundation uses another database, add a separate search index only when needed; the operational database remains authoritative.']
      ]},
      {title:['第三阶段：以评估结果决定扩展','Stage three: expand based on measured results'],paragraphs:[
        ['以历史真实询价建立评估样本，比较候选命中、字段提取正确性、采购员采纳率、响应时间与单次成本。先约定目标再试点，不能把未经验证的准确率写成承诺。','Create an evaluation set from real historical RFQs. Measure shortlist relevance, extraction accuracy, buyer adoption, latency and per-request cost. Agree targets before a pilot rather than promising untested accuracy.'],
        ['外部文档视为待分析的数据，不能指挥系统执行操作。检索和生成都遵守企业权限；敏感报价不跨企业共享。外部模型与私有模型的选择，由数据边界、质量、预算和运维能力决定。','Treat external documents as data, not instructions to execute actions. Apply organisation permissions to retrieval and generation; do not expose private quotes across companies. Choose external or private models based on data boundaries, quality, budget and operational capability.']
      ]}

    outcome:['本部分交付：数据准备清单、AI 试点场景、权限边界、评估样本与上线门槛。','Deliverables: data readiness requirements, an AI pilot, access boundaries, evaluation cases and release criteria.'],
    ask:['会议确认：已有多少可用供应商资料和历史报价？最希望 AI 节省哪一步工作？哪些数据允许发送给外部模型？','Discuss: what supplier data and historical quotes exist? Which task should AI save time on first? What data may be sent to external models?'],
    talk:['“AI 会先帮助团队更快地理解需求、找到候选和比较信息。每个建议都应该有依据，重要采购决定仍由人确认。”','“AI would first help your team understand requests, find candidates and compare information faster. Recommendations should be evidence-based, with important purchasing decisions confirmed by people.”'],
    sources:[['pgvector: Postgres vector search','https://github.com/pgvector/pgvector']]

  {
    id:'scale',nav:['从肯尼亚到非洲','Scaling across Africa'],
    title:['先服务好肯尼亚。\n再走向下一个市场。','Start well in Kenya.\nGrow market by market.'],
    question:['06 · 如何扩展到其他非洲市场？','06 · How would we scale into other African markets?'],
    lead:['共享核心交易流程，把国家差异放在配置与集成中。每个新市场都通过真实订单验证后再开放。','Share the core trading workflow and isolate country differences in configuration and integrations. Validate each new market with real operational scenarios before launch.'],
    takeaway:['可扩展既包括更多交易，也包括不同国家的运营规则。','Scalability means both more transactions and different operating rules across countries.'],
    cards:[
      {title:['市场可配置','Configurable markets'],body:['语言、币种、地址、费用、单证和服务区域按市场管理。','Manage languages, currencies, addresses, charges, documents and coverage by market.']},
      {title:['服务可替换','Replaceable integrations'],body:['支付与物流使用统一接口，每个国家接入适合的服务商。','Use common payment and logistics interfaces, with suitable providers in each country.']},
      {title:['容量可增长','Capacity that can grow'],body:['从性能实测开始，按需增加应用实例、后台任务和查询能力。','Measure real performance, then add application capacity, workers and query resources where needed.']}
    ],
    diagram:'scale',
    details:[
      {title:['国家、企业与币种分开建模','Separate markets, legal entities and currencies'],paragraphs:[
        ['同一个买家可能在多个市场采购，一个国家也可能有多个运营主体。因此市场、企业、仓库、订单币种和结算币种分别保存，不能用一个 country 字段代替全部业务关系。','A buyer may trade in several markets, and a country may contain several operating entities. Store market, organisation, warehouse, order currency and settlement currency separately rather than using one country field for every relationship.'],
        ['国家配置包含展示语言、地址格式、可用支付方式、配送区域、费用和单证模板。税务、开票与数据处理要求由当地业务及专业顾问确认，再转成可测试的规则。','Market configuration includes language, address formats, payment methods, service regions, charges and document templates. Local business owners and qualified advisers confirm tax, invoicing and data-handling requirements before they become tested system rules.']
      ]},
      {title:['用适配器连接支付与物流','Connect payments and logistics through adapters'],paragraphs:[
        ['每个支付服务商映射到发起、查询、通知、退款和对账能力；不具备某项能力时显式标记，并给出人工处理路径。系统不能假设所有国家的支付行为一致。','Map each provider to initiation, status checks, notifications, refunds and reconciliation. Explicitly flag unsupported capabilities and provide a manual path. Do not assume identical payment behaviour across countries.'],
        ['承运商状态转换成平台统一节点，同时保留原始事件；重复和乱序通知不能覆盖已确认状态，合法更正或撤回按独立事件审核留痕。切换国家时通过测试账号、真实单证和小范围订单验证连接。','Normalise carrier statuses while retaining original events. Duplicated or out-of-order updates must not overwrite confirmed state; handle legitimate corrections or reversals as separately reviewed, audited events. Validate new markets through test accounts, documents and limited live orders.']
      ]},
      {title:['按实际瓶颈扩容，并能恢复故障','Scale measured bottlenecks and recover from failures'],paragraphs:[
        ['上线前约定并测试峰值并发、商品数量、订单量和关键响应时间。先优化查询、图片与后台任务，再增加无状态服务实例；只有独立模块出现容量或组织需求时才拆分服务。','Agree and test peak concurrency, catalogue size, order volume and response-time targets before release. Optimise queries, media and background work, then add stateless instances. Split services when a module has a demonstrated capacity or ownership need.'],
        ['部署区域通过肯尼亚实际网络测试与数据要求决定。约定可接受的数据丢失窗口和恢复时长，验证备份可恢复；未来确有区域隔离要求时，再扩展到多区域部署。','Select a hosting region using Kenyan network tests and data requirements. Agree acceptable data loss and recovery time, and test restoration. Introduce multi-region deployment when regional separation is actually needed.']
      ]}
    ],
    outcome:['本部分交付：市场配置模型、支付/物流接口规范、容量测试目标、第二市场上线清单。','Deliverables: market configuration models, payment/carrier contracts, load-test targets and a second-market launch checklist.'],
    ask:['会议确认：肯尼亚之后最可能进入哪个国家？是否同一法人运营？每个市场有哪些支付、物流和语言需求？','Discuss: which country is most likely to follow Kenya? Will the same legal entity operate there? What payment, carrier and language needs differ?'],
    talk:['“我们会预留国家差异的扩展位置，尽量复用核心流程。进入第二个市场前，会重新确认当地交易、税务和物流规则，再判断需要配置、集成还是新增模块。”','“We would make room for country differences and reuse the core wherever possible. Before entering the next market, we would reassess local trading, tax and logistics rules to determine what needs configuration, integration or new modules.”'],
    sources:[['Safaricom developer portal','https://developer.safaricom.co.ke/'],['Frappe sites','https://docs.frappe.io/framework/user/en/basics/sites']]
  },
  {
    id:'delivery',nav:['分期与技术栈','Delivery & stack'],
    title:['每一步，\n都有可验证的成果。','A clear outcome.\nAt every step.'],
    question:['07 · 推荐怎样的开发阶段与技术栈？','07 · What development phases and technology stack do we recommend?'],
    lead:['从业务确认和底座验证开始，以一条可运营的交易流程作为首期目标。时间与投入在范围明确后共同确定。','Begin with business discovery and foundation validation. Make one operational trading journey the pilot objective, then agree timing and investment against a defined scope.'],
    takeaway:['先验证业务与底座，再开发闭环；移动 App、AI 与多国运营按价值逐步加入。','Validate the business and foundation, then deliver the full journey; add native apps, AI and new markets as value is proven.'],

    ];
    return `<section class="research"><h2 class="research-title">${pair(['六个成熟候选。逐一看清。','Six established candidates. A closer look.'])}</h2>
      <p class="research-intro">${pair(['以下为官方资料核对后的桌面研究，尚未完成安装验证。点击候选查看现有能力、二开缺口和许可范围。','A documentation-based assessment against official sources; implementation proofs are still pending. Open a candidate to inspect capabilities, customisation gaps and licensing.'])}</p>
      <div class="candidate-list">${data.candidates.map(c => `<details class="detail candidate"><summary><span class="candidate-title">${highlight(c.name)}</span><span class="candidate-tag">${pair(labels[c.id] || ['条件备选','Conditional alternative'])}</span></summary><div class="detail-body"><div class="candidate-meta">${highlight(typeof c.stack === 'string' ? c.stack : c.stack?.en)} · ${escape(c.license?.label || '')}</div>${c.reviewedLabel ? `<p class="research-note">${objectPair(c.reviewedLabel)}</p>` : ''}<div class="candidate-grid">${fields.filter(([f]) => c[f]).map(([field,label]) => `<div><h3>${pair(label)}</h3><p>${objectPair(c[field])}</p></div>`).join('')}</div><div class="source-links">${links(c.sources.map(s => [s.title,s.url]))}</div></div></details>`).join('')}</div>
      <p class="research-note">${pair(['“优先验证”是基于目前业务描述的技术判断，不代表客户已选定或我们已经完成性能与功能验证。选定版本、扩展模块和合同交付方式需要逐项复核。','“Evaluate first” is a technical judgment based on the current description, not a client decision or completed feature/performance validation. Recheck the selected release, extensions and delivery arrangement.'])}</p>
      <span class="research-status">${pair(['资料核对：2026-10-09 · 来源见各候选','Sources checked: 09 Oct 2026 · linked under each candidate'])}</span></section>`;
  }
  function renderChapter(chapter,index) {
    return `<article id="panel-${chapter.id}" class="chapter" aria-labelledby="title-${chapter.id}" hidden>
      <div class="print-brand">DARAJA · PRODUCT & TECHNOLOGY BRIEF · 09 OCT 2026</div>
      <div class="hero"><p class="eyebrow">${pair(chapter.question)}</p><h1 id="title-${chapter.id}" tabindex="-1">${pair(chapter.title)}</h1><p class="hero-lead secondary">${pair(chapter.lead)}</p><p class="takeaway">${pair(chapter.takeaway)}</p>${technologyStrip(chapter.id)}${index===0 ? `<p class="brief-note">${pair(['讨论基础：Kui 的往来邮件。Technology Brief 尚待审阅；本页区分建议与待确认事项。','Based on Kui’s correspondence. The Technology Brief is still to be reviewed; proposals and open decisions are identified throughout.'])}</p>`:''}</div>
      <div class="pillars">${chapter.cards.map((c,i) => `<section class="pillar"><span class="pillar-index">0${i+1}</span><h2>${pair(c.title)}</h2><p>${pair(c.body)}</p></section>`).join('')}</div>
      ${diagram(chapter.diagram)}${chapter.id==='foundations' ? research() : ''}
      <section class="explanations"><h2 class="details-heading">${pair(['把方案，讲清楚。','The thinking behind the proposal.'])}</h2><div>${chapter.details.map(d=>`<details class="detail"><summary>${pair(d.title)}</summary><div class="detail-body">${d.table?table(d.table):''}${d.paragraphs.map(p=>`<p>${pair(p)}</p>`).join('')}</div></details>`).join('')}</div></section>
      <p class="outcome">${pair(chapter.outcome)}</p>
      <section class="meeting-box">${kicker(['留给这次会面的关键问题','A decision to discuss together'])}<p>${pair(chapter.ask)}</p></section>
      <details class="talk"><summary>${pair(['讲解提示','Speaker notes'])}</summary><blockquote>${pair(chapter.talk)}</blockquote></details>
      ${chapter.sources.length ? `<div class="sources">${pair(['技术参考 · 其余内容为建议方案','Technical references · other content is a proposed design'])}<div class="source-links">${links(chapter.sources)}</div></div>`:''}
    </article>`;
  }
  const chapters = window.BRIEF;
  document.getElementById('main').innerHTML = chapters.map(renderChapter).join('');
  document.getElementById('chapter-nav').innerHTML = chapters.map((c,i)=>`<a class="nav-link" href="#${c.id}"><span class="nav-number">0${i+1}</span><span class="nav-label">${pair(c.nav)}</span></a>`).join('');
  let activeIndex = 0;
  function closeMenu() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-shade').hidden = true;
    document.getElementById('menu-button').setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  }
  function showChapter(focus = false) {
    const requested = location.hash.slice(1);
    const found = chapters.findIndex(c => c.id === requested);
    activeIndex = found >= 0 ? found : 0;
    const chapter = chapters[activeIndex];
    document.querySelectorAll('.chapter').forEach((el,i) => {el.hidden = i !== activeIndex;});
    document.querySelectorAll('.nav-link').forEach((el,i)=>{if(i===activeIndex)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
    document.getElementById('current-chapter').innerHTML = pair(chapter.nav);
    document.getElementById('page-counter').textContent = `0${activeIndex+1} / 07`;
    document.getElementById('previous').disabled = activeIndex===0;
    document.getElementById('next').disabled = activeIndex===chapters.length-1;
    const language = document.body.dataset.language;
    document.title = `Daraja · ${chapter.nav[language==='en'?1:0]}`;
    closeMenu();
    window.scrollTo({top:0,behavior:'instant'});
    if(focus) document.getElementById(`title-${chapter.id}`).focus({preventScroll:true});
  }
  window.addEventListener('hashchange',()=>showChapter(true));
  document.querySelectorAll('.nav-link,.brand').forEach(link=>link.addEventListener('click',()=>{
    closeMenu();
    if(link.getAttribute('href')===location.hash)showChapter(true);
  }));
  document.getElementById('previous').addEventListener('click',()=>{if(activeIndex>0)location.hash=chapters[activeIndex-1].id;});
  document.getElementById('next').addEventListener('click',()=>{if(activeIndex<chapters.length-1)location.hash=chapters[activeIndex+1].id;});
  document.querySelectorAll('.language-switch button').forEach(button=>button.addEventListener('click',()=>{
    const language=button.dataset.language;
    document.body.dataset.language=language;
    document.documentElement.lang=language==='en'?'en':'zh-CN';
    document.querySelectorAll('.language-switch button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    document.title=`Daraja · ${chapters[activeIndex].nav[language==='en'?1:0]}`;
    try{localStorage.setItem('daraja-language',language);}catch{}
  }));
  try{const saved=localStorage.getItem('daraja-language');if(['zh','en','both'].includes(saved))document.querySelector(`.language-switch button[data-language="${saved}"]`).click();}catch{}
  document.getElementById('menu-button').addEventListener('click',()=>{
    const sidebar=document.getElementById('sidebar');
    const opened=sidebar.classList.toggle('open');
    document.getElementById('sidebar-shade').hidden=!opened;
    document.getElementById('menu-button').setAttribute('aria-expanded',String(opened));
    document.body.style.overflow=opened?'hidden':'';
    if(opened)sidebar.querySelector('[aria-current=page]').focus();
  });
  document.getElementById('sidebar-shade').addEventListener('click',closeMenu);
  window.matchMedia('(max-width:700px)').addEventListener('change',event=>{if(!event.matches)closeMenu();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sidebar').classList.contains('open')){closeMenu();document.getElementById('menu-button').focus();}});
  document.querySelectorAll('.flow-node').forEach(button=>button.addEventListener('click',()=>{
    document.querySelectorAll('.flow-node').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    document.getElementById('flow-description').innerHTML=pair(steps[Number(button.dataset.step)].body);
  }));
  let printState=[];
  window.addEventListener('beforeprint',()=>{printState=Array.from(document.querySelectorAll('details')).map(el=>[el,el.open]);printState.forEach(([el])=>{el.open=true;});});
  window.addEventListener('afterprint',()=>{printState.forEach(([el,open])=>{el.open=open;});printState=[];});
  document.getElementById('print-button').addEventListener('click',()=>window.print());
  showChapter();
})();

</script>
</body>
</html>
