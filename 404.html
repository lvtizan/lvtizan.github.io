  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}

  .links{margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
