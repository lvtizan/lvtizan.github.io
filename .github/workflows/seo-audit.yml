name: SEO audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata, links, language pairs and JSON-LD
        run: python3 scripts/seo_audit.py
      - name: Verify sitemap coverage
        run: python3 scripts/gen_sitemap.py --check
